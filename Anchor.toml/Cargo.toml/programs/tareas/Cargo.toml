[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
tareas = "11111111111111111111111111111111"

[programs.devnet]
tareas = "11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[package]
name = "tareas"
version = "0.1.0"
description = "Lista de tareas en Solana (proyecto final Advanced)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tareas"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"

